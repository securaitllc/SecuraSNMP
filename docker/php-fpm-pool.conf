; Nodus php-fpm pool. Concurrency comes from the worker pool — this is what fixes
; the single-threaded serialization of `php artisan serve`.
; Workers run as www-data, not root: a web-tier code-exec or file-write bug must
; not become root in the container. entrypoint.sh hands storage/ and
; bootstrap/cache/ to www-data before php-fpm starts (the only paths it writes).
[www]
user = www-data
group = www-data
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Surface fatal/startup errors in the container log instead of a blank 502.
catch_workers_output = yes
