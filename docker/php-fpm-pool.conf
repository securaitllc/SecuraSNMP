; Nodus php-fpm pool. Runs as root to match the previous `php artisan serve`
; execution (the app + storage were owned/written as root), avoiding any
; permission surprise on a running deployment. Concurrency comes from the
; worker pool — this is what fixes the single-threaded serialization.
[www]
user = root
group = root
listen = 127.0.0.1:9000

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 8
pm.max_requests = 500

; Surface fatal/startup errors in the container log instead of a blank 502.
catch_workers_output = yes
