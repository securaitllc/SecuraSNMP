; Nodus PHP runtime settings. Applies to BOTH the php-fpm workers and the CLI,
; which is what matters here: the pollers are CLI processes.
;
; The image never installed a php.ini at all — only the php.ini-development and
; php.ini-production samples ship with the base image, and neither is active — so
; PHP's compiled-in default of 128M governed every poller. Nobody chose 128M.
;
; That default silently broke the vulnerability subsystem for two months. The CVE
; catalog grew to ~66,000 affected-ranges, and two things in the refresh cycle do
; not fit in 128M beside a booted Laravel kernel:
;
;   full NVD pull, all targets held in memory ... 126 MB peak (measured)
;   CveAffect::all() over 63,566 rows .......... 130 MB resident, 170 MB peak
;
; A process that exceeds the limit is killed outright. The supervisor restarted it,
; the restart wrote a fresh liveness heartbeat, /api/health/pollers read that
; heartbeat and reported "ok" — so a loop that had never completed a single cycle
; looked healthy while every device's findings stayed frozen on whatever firmware
; it ran at the last successful pass.
;
; 512M is sized against the measured peaks with room for catalog growth, not
; guessed. The feed is also applied per vendor group now, so the steady-state need
; is well under this; the headroom is what keeps a growing catalog from walking
; into the same wall again.
memory_limit = 512M
