# Production web server for Nodus — replaces the single-threaded `php artisan
# serve` dev server so concurrent NOC screens + the wallboard TV + a user
# navigating (which fires several API calls at once) no longer serialize.
# nginx serves static assets + hands PHP to php-fpm's worker pool.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    server {
        listen 8000;
        server_name _;
        root /var/www/html/public;
        index index.php;
        client_max_body_size 25M;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120;
        }

        # Never serve dotfiles (except ACME well-known), which would leak .env etc.
        location ~ /\.(?!well-known).* { deny all; }
    }
}
