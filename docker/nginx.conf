# Production web server for Nodus — replaces the single-threaded `php artisan
# serve` dev server so concurrent NOC screens + the wallboard TV + a user
# navigating (which fires several API calls at once) no longer serialize.
# nginx serves static assets + hands PHP to php-fpm's worker pool.
worker_processes auto;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Baseline security headers for responses PHP never touches (static files,
    # nginx's own errors). SecurityHeaders.php already sets these on app responses,
    # so each map yields "" when upstream sent the header — nginx skips an empty
    # add_header, so a PHP response never carries the header twice. Values must
    # match SecurityHeaders.php. CSP/HSTS stay with the app (per-request nonce).
    map $upstream_http_x_content_type_options $nodus_xcto { "" "nosniff"; default ""; }
    map $upstream_http_x_frame_options $nodus_xfo { "" "DENY"; default ""; }
    map $upstream_http_referrer_policy $nodus_referrer { "" "strict-origin-when-cross-origin"; default ""; }
    map $upstream_http_permissions_policy $nodus_permissions { "" "geolocation=(), microphone=(), camera=()"; default ""; }

    server {
        listen 8000;
        server_name _;
        root /var/www/html/public;
        index index.php;
        client_max_body_size 25M;

        # Server level so every location inherits them — a location that declares
        # its own add_header would silently drop all of these.
        add_header X-Content-Type-Options $nodus_xcto always;
        add_header X-Frame-Options $nodus_xfo always;
        add_header Referrer-Policy $nodus_referrer always;
        add_header Permissions-Policy $nodus_permissions always;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            include fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120;
            # Never disclose the PHP version, even if expose_php is ever re-enabled.
            fastcgi_hide_header X-Powered-By;
        }

        # Never serve dotfiles (except ACME well-known), which would leak .env etc.
        location ~ /\.(?!well-known).* { deny all; }
    }
}
