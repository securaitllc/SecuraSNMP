# SecuraSNMP (Nodus) — Portainer stack, TWO-CONTAINER topology.
#
# Same image, two roles (set by APP_ROLE):
#   * app     — nginx + php-fpm worker pool (serves the app, runs migrations)
#   * pollers — the monitoring loops + snmptrapd (udp/162) + syslog (udp/514) + queue
# Splitting them keeps a heavy SNMP/SSH sweep from ever competing with web requests
# for CPU. They share a small "poller-beats" volume so /api/health/pollers works.
#
# Caddy uses an inline `configs:` block (no host bind mount), so this deploys
# straight from Portainer's web editor. Set the ${VAR}s in the stack's
# Environment variables section.

services:
  caddy:
    # Pinned to a specific, PROVEN version (not floating `2-alpine`): a routine app
    # deploy must never pull a new proxy image. Watchtower is also scoped away from
    # this service (see below), so the proxy only changes when you bump this tag.
    # MUST stay >= 2.11: default_sni (serving the internal cert to SNI-less clients —
    # a browser/curl hitting the bare management IP sends no SNI) regressed in 2.8.4
    # and works in 2.11.4. Verified: 2.8.4 fails the no-SNI handshake, 2.11.4 serves.
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "${BIND_IP}:${HTTPS_PORT}:${HTTPS_PORT}"
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      HTTPS_PORT: ${HTTPS_PORT}
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    labels:
      # Watchtower must NEVER recreate the proxy (doing so dropped its published
      # port and took prod offline). Only the app image is auto-updated.
      - "com.centurylinklabs.watchtower.enable=false"

  app:
    image: ghcr.io/securaitllc/securasnmp:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      # The ONLY container Watchtower is allowed to auto-update.
      - "com.centurylinklabs.watchtower.enable=true"
    environment:
      APP_ROLE: web
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      SESSION_SECURE_COOKIE: "true"
      TRAP_COMMUNITY: ${TRAP_COMMUNITY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: securasnmp
      DB_USERNAME: securasnmp
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: alerts@securasnmp.local
      POLL_NEXTHOP_SECONDS: "90"
      POLL_INTERFACE_SECONDS: "90"
      POLL_EDGECONNECT_SECONDS: "90"
    volumes:
      - poller-beats:/var/www/html/storage/app/pollers
    depends_on:
      mysql:
        condition: service_healthy

  pollers:
    image: ghcr.io/securaitllc/securasnmp:latest
    pull_policy: always
    restart: unless-stopped
    labels:
      # Same image as app — auto-update it in lockstep.
      - "com.centurylinklabs.watchtower.enable=true"
    ports:
      - "${BIND_IP}:162:162/udp"
      - "${BIND_IP}:514:514/udp"
    environment:
      APP_ROLE: pollers
      APP_KEY: ${APP_KEY}
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL}
      SESSION_SECURE_COOKIE: "true"
      TRAP_COMMUNITY: ${TRAP_COMMUNITY}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: securasnmp
      DB_USERNAME: securasnmp
      DB_PASSWORD: ${DB_PASSWORD}
      SESSION_DRIVER: database
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      CORS_ALLOWED_ORIGINS: ${APP_URL}
      MAIL_MAILER: log
      MAIL_FROM_ADDRESS: alerts@securasnmp.local
      POLL_NEXTHOP_SECONDS: "90"
      POLL_INTERFACE_SECONDS: "90"
      POLL_EDGECONNECT_SECONDS: "90"
    volumes:
      - poller-beats:/var/www/html/storage/app/pollers
    depends_on:
      mysql:
        condition: service_healthy
      app:
        condition: service_started

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    labels:
      # The database is pinned and must never be auto-recreated by Watchtower.
      - "com.centurylinklabs.watchtower.enable=false"
    environment:
      MYSQL_DATABASE: securasnmp
      MYSQL_USER: securasnmp
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Auto-updates ONLY the app + pollers (label-enabled). It cannot see caddy,
  # mysql, or itself, so a routine app release can never recreate the proxy or DB
  # again. Pinned image (not :latest) so Watchtower never surprises-updates itself.
  #
  # Private GHCR pulls need registry auth: mount the host docker config that holds
  # the ghcr.io token at /config.json (adjust the host path to wherever `docker
  # login ghcr.io` wrote it — usually /root/.docker/config.json).
  watchtower:
    image: containrrr/watchtower:1.7.1
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${DOCKER_CONFIG_JSON:-/root/.docker/config.json}:/config.json:ro
    command: --label-enable --cleanup --interval 300

configs:
  caddyfile:
    content: |
      {
        default_sni {$$APP_DOMAIN}
      }
      {$$APP_DOMAIN}:{$$HTTPS_PORT} {
        bind 0.0.0.0
        encode gzip
        reverse_proxy app:8000 {
          header_up X-Forwarded-Proto https
          # Overwrite (not append) with the real TCP peer so a client cannot spoof
          # its source IP in the audit log. Pairs with the app trusting only this
          # proxy's network (see the trustProxies fix), not every upstream.
          header_up X-Forwarded-For {remote_host}
        }
      }

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
  poller-beats:
